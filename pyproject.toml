[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["convoy_commander*"]

[project]
name = "convoy_commander"
version = "0.1.0"
description = "Autonomous Tactical Convoy Commander – fleet coordination in GPS-denied environments"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "scipy>=1.10",
]

[project.scripts]
convoy-commander = "convoy_commander.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.5",
]
geo = [
    "rasterio>=1.3",
    "osmnx>=1.6",
    "pyproj>=3.5",
]
weather = [
    "requests>=2.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
